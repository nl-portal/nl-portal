nl-portal:
    config:
        ikoapi:
            enabled: true
            properties:
                url: http://localhost:8084
                token-url: http://localhost:8082/auth/realms/iko/protocol/openid-connect/token
                client-id: nl-portal
                client-secret: jenv-portal-local-secret
                allowed-profiles: personen,vergunningen,parkeerplekken
    frontend:
        menu-entries:
            -   name: erfpacht
                icon: BuildingIcon
                group: 99
                audience: [ burger, bedrijf ]
                route:
                    type: templated
                    page: erfpacht-text-only
                    path: /erfpacht
            -   name: wonen-en-bouwen
                icon: HouseIcon
                group: 99
                audience: [ burger, bedrijf ]
                route:
                    type: templated
                    page: wonen-en-bouwen
                    path: /wonen-en-bouwen
            -   name: parkeervergunning
                hidden: true
                audience: [ burger, bedrijf ]
                route:
                    type: templated
                    page: parkeervergunning
                    path: /parkeervergunningen/:id
        pages:
            wonen-en-bouwen:
                type: dynamic
                template:
                    source: file
                    params:
                        file: wonen-en-bouwen.pagetemplate.json
                bindings:
                    woonboten:
                        resolver: openproduct
                        params:
                            product-type-codes: PARKEREN, BEZOEKERSVERGUNNING
                            page: 0
                            size: 5
                        overrides: [ page, filter.status ]
                        projection: '{items: [.results[] | {id: .uuid, naam, startDatum: .start_datum, eindDatum: .eind_datum, status, prijs}], total: .count}'
            parkeervergunning:
                type: dynamic
                template:
                    source: file
                    params:
                        file: parkeervergunning.pagetemplate.json
                bindings:
                    vergunning:
                        resolver: openproduct
                        params:
                            product-type-codes: PARKEREN, BEZOEKERSVERGUNNING
                        projection: '{naam, startDatum: .start_datum, eindDatum: .eind_datum, status, prijs, kentekens: (.verbruiksobject.data.kentekens // []), periodes: [(.verbruiksobject.data.periodes // [])[] | {datetimeStart, kenteken, status}]}'

