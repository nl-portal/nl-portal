graphql:
    packages:
        - "nl.nlportal"

nl-portal:
    config:
      openklant2:
          enabled: true
          properties:
              klantinteracties-api-url: http://localhost:9007/klantinteracties/api/v1
              token: ac045222c9e7cde8120b48735560f9b920bb58cd
              #digital-adressen-referentie: portaal
              klant-contact-code-register:
                  product: open-product
                  zaak: open-zaak
      verificatie:
        enabled: false
        properties:
            url: http://localhost:9009
            types-need-verification: email, telefoonnummer
      documentenapis:
          enabled: true
          properties:
              #virusscan:
              #clamav:
              #hostName: localhost
              #enabled: true
              defaultDocumentApi: openzaak
              vertrouwelijkheidsaanduiding-whitelist:
                  - openbaar
                  - beperkt_openbaar
                  - intern
                  - zaakvertrouwelijk
                  - vertrouwelijk
                  - confidentieel
                  - geheim
                  - zeer_geheim
              status-whitelist:
                  - ter_vaststelling
                  - in_bewerking
                  - definitief
                  - gearchiveerd
              configurations:
                  openzaak:
                      url: http://localhost:8001/documenten/api/v1
                      clientId: valtimo_client
                      secret: e09b8bc5-5831-4618-ab28-41411304309d
                      rsin: "051845623"
                      documentTypeUrl: http://localhost:8001/catalogi/api/v1/informatieobjecttypen/efc332f2-be3b-4bad-9e3c-49a6219c92ad
                  dummydoc:
                      url: http://localhost:8002/documenten/api/v1
                      clientId: docdoc
                      secret: e09b8bc5-5831-4618-ab28-41411304309d


logging:
    level:
        reactor.netty.http.client.HttpClient: TRACE

spring:
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8082/auth/realms/nlportal

---

spring:
    config:
        activate:
            on-profile: openklant-disabled

nl-portal:
    config:
        openklant2:
            enabled: false

---

spring:
    config:
        activate:
            on-profile: openklant-misconfigured

nl-portal:
    config:
        openklant2:
            enabled: true
            properties:
                klantinteracties-api-url:
                token:
