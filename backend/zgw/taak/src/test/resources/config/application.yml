graphql:
    packages:
        - "nl.nlportal"

logging:
    level:
        reactor.netty.http.client.HttpClient: TRACE

nl-portal:
    config:
        objectenapi:
            enabled: true
            properties:
                url: http://localhost:8010
                token: 0000000000000000000000000000000000000000
        form:
            properties:
                form-definition-object-type-url: "http://localhost:8010/api/v1/objecttypes/form-definition-type"
        taak:
            enabled: true
            properties:
                object-type-url: "http://localhost:8010/api/v1/objecttypes/3c24cab6-4346-4c7d-912b-e34a1e9e21bf"
        documentenapis:
            enabled: true
            properties:
                default-document-api: openzaak
                configurations:
                    openzaak:
                        url: http://localhost:8001
                        rsin: "051845623"
                        document-type-url: "http://localhost:8001/api/v1/informatieobjecttypen/1"
                    dummy:
                        url: http://localhost:8002
                        rsin: "051845624"
                        document-type-url: "http://localhost:8002/api/v1/informatieobjecttypen/1"
        payment:
            direct:
                enabled: true
                properties:
                    url: https://payment.preprod.direct.worldline-solutions.com
                    webhookUrl: http://localhost:8090/api/public/payment/direct/postsale
                    sha-out-parameters: AAVADDRESS,AAVCHECK,AAVMAIL,AAVNAME,AAVPHONE,AAVZIP,ACCEPTANCE,ALIAS,AMOUNT,BIC,BIN,BRAND,CARDNO,CCCTY,CN,COLLECTOR_BIC,COLLECTOR_IBAN,COMPLUS,CREATION_STATUS,CREDITDEBIT,CURRENCY,CVCCHECK,DCC_COMMPERCENTAGE,DCC_CONVAMOUNT,DCC_CONVCCY,DCC_EXCHRATE,DCC_EXCHRATESOURCE,DCC_EXCHRATETS,DCC_INDICATOR,DCC_MARGINPERCENTAGE,DCC_VALIDHOURS,DIGESTCARDNO,ECI,ED,EMAIL,ENCCARDNO,FXAMOUNT,FXCURRENCY,IP,IPCTY,MANDATEID,MOBILEMODE,NBREMAILUSAGE,NBRIPUSAGE,NBRIPUSAGE_ALLTX,NBRUSAGE,NCERROR,ORDERID,PAYID,PAYIDSUB,PAYMENT_REFERENCE,PM,SCO_CATEGORY,SCORING,SEQUENCETYPE,SIGNDATE,STATUS,SUBBRAND,SUBSCRIPTION_ID,TRXDATE,VC
                    configurations:
                        belastingzaken:
                            pspId: TAX
                            language: "en_US"
                            returnUrl: http://localhost:3000
                            apiKey: tetetette
                            apiSecret: gdgdggd
                            webhookApiKey: 65325525d7b846168fa4784f94485a
                            webhookApiSecret: 418f68e5-fcff-413f-9b06-77649ba3c52e

    authentication:
        machtingsdienst:
            resource-url: classpath:machtigingsdiensten.json

spring:
    liquibase:
        enabled: true
        change-log: classpath:config/liquibase/form-master.xml
    datasource:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:taak-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
        username: sa
        password: ""
        hikari:
            auto-commit: false
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        open-in-view: false
        properties:
            hibernate:
                hbm2ddl.auto: none
                connection:
                    provider_disables_autocommit: true
    security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: http://localhost:8082/auth/realms/nlportal
