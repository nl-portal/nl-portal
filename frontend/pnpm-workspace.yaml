# Edit this file by hand. Using `pnpm config` reformats the file and removes all comments.
packages:
  - "./packages/**"

# Configure pnpm so peer dependencies must be explicitly added instead of being automatically installed.
autoInstallPeers: false

# Configure pnpm so it only installs package versions that have been published on the npm registry for at least 24 hours
# (1440 minutes). This helps mitigate the risk of supply chain attacks by avoiding newly published, potentially
# malicious versions. Keep this in sync with npm-check-updates's `cooldown` configuration.
minimumReleaseAge: 1440

# Make an exception for trusted packages, notably our own
minimumReleaseAgeExclude:
  - "@gemeente-denhaag/*"
  - "@utrecht/*"

# Configure pnpm to save exact version numbers (not including ^ or ~) in package.json. Lock dependencies to specific
# versions to ensure reproducible installs and prevent automatic upgrades to newer minor or patch releases.
saveExact: true
savePrefix: ""

# Configure pnpm to not fail when there are missing or invalid peer dependencies in the tree.
strictPeerDependencies: false

# Transitive-dependency pins carried over from packages/app. pnpm only honours `overrides` at the
# workspace root, so they live here now that the app is built from the workspace (frontend/Dockerfile)
# instead of standalone. Prefer bumping the owning direct dependency; these are a stopgap.
# React-context singletons. The libraries declare these as peerDependencies (ranges, consumer-facing)
# and mirror those ranges in devDependencies. Once the apps consume the libraries via workspace:*
# instead of published tarballs, those devDependency ranges resolve to their own copies, so a lib and
# an app end up with two Reacts, two IntlProviders, two Routers. Pinning one version each here
# collapses them without changing the published peerDependency ranges.
overrides:
  react: 19.2.7
  react-dom: 19.2.7
  react-intl: 7.1.14
  react-router: 7.16.0
  "@apollo/client": 3.13.8
  "@babel/core": 7.29.6
  esbuild: 0.28.1
  rollup: 4.59.0
  flatted: 3.4.2
  dompurify: 3.4.9
  js-cookie: 3.0.7
  basic-ftp: 5.3.1
  uuid: 11.1.1
  picomatch@2: 2.3.2
  picomatch@4: 4.0.4
  minimatch@<3.1.4: 3.1.4
  brace-expansion@<1.1.13: 1.1.13
  lodash-es@>=4.0.0 <=4.17.23: 4.18.0
  lodash@>=4.0.0 <=4.17.23: 4.18.0
  postcss@<8.5.10: 8.5.10

allowBuilds:
  "@parcel/watcher": true
  core-js: false
  esbuild: true
